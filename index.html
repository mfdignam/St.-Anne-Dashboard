<style>
  :root {
    --bg: #f6f7f5;
    --card-bg: #ffffff;
    --text: #1c2321;
    --muted: #5b6663;
    --border: #e2e6e3;
    --accent: #1f7a4d;
    --cat-schoolwide: #2f6fd6;
    --cat-kinder: #1f9e7a;
    --cat-family: #d97a1f;
    --cat-athletics: #7c4fd6;
    --cat-fyi: #8a8f8c;
    --badge-warning-bg: #fff3d6;
    --badge-warning-text: #8a5a00;
    --badge-critical-bg: #fde2e1;
    --badge-critical-text: #9c2a26;
    --badge-neutral-bg: #eceeec;
    --badge-neutral-text: #565b58;
    --badge-good-bg: #e2f5ea;
    --badge-good-text: #1c7a4a;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #14181a;
      --card-bg: #1d2224;
      --text: #eef1ef;
      --muted: #9aa39e;
      --border: #2c3234;
      --cat-schoolwide: #6fa2f2;
      --cat-kinder: #4ecba0;
      --cat-family: #f0a24f;
      --cat-athletics: #a688f0;
      --cat-fyi: #8a9390;
      --badge-warning-bg: #3a2f10;
      --badge-warning-text: #f0c46a;
      --badge-critical-bg: #3a1a19;
      --badge-critical-text: #f2938f;
      --badge-neutral-bg: #262b2d;
      --badge-neutral-text: #b7bdba;
      --badge-good-bg: #17301f;
      --badge-good-text: #7fdca8;
      --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181a;
    --card-bg: #1d2224;
    --text: #eef1ef;
    --muted: #9aa39e;
    --border: #2c3234;
    --cat-schoolwide: #6fa2f2;
    --cat-kinder: #4ecba0;
    --cat-family: #f0a24f;
    --cat-athletics: #a688f0;
    --cat-fyi: #8a9390;
    --badge-warning-bg: #3a2f10;
    --badge-warning-text: #f0c46a;
    --badge-critical-bg: #3a1a19;
    --badge-critical-text: #f2938f;
    --badge-neutral-bg: #262b2d;
    --badge-neutral-text: #b7bdba;
    --badge-good-bg: #17301f;
    --badge-good-text: #7fdca8;
    --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px calc(40px + env(safe-area-inset-bottom)); }

  /* Lock screen */
  #lock-screen {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    gap: 16px;
  }
  #lock-screen .lock-icon { font-size: 48px; }
  #lock-screen h1 { font-size: 20px; margin: 0; }
  #lock-screen p { color: var(--muted); margin: 0; font-size: 14px; }
  #lock-form { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px; margin-top: 8px; }
  #passphrase {
    font-size: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
  }
  #unlock-btn {
    font-size: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  #unlock-btn:active { opacity: 0.85; }
  #lock-error { color: var(--badge-critical-text); font-size: 13px; min-height: 18px; }

  [hidden] { display: none !important; }

  /* Header */
  .dash-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .dash-header h1 { font-size: 21px; margin: 0 0 4px; }
  .subtitle { margin: 0; color: var(--muted); font-size: 13px; }
  .header-meta { display: flex; align-items: center; gap: 10px; }
  .updated { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .theme-toggle {
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 15px;
  }

  /* Stats */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .stat-tile {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    box-shadow: var(--shadow);
  }
  .stat-tile-wide { grid-column: 1 / -1; }
  .stat-num { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .stat-num-sm { font-size: 17px; font-weight: 700; }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* Cards */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .card h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }

  /* Category dots */
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot-schoolwide { background: var(--cat-schoolwide); }
  .dot-kinder { background: var(--cat-kinder); }
  .dot-family { background: var(--cat-family); }
  .dot-athletics { background: var(--cat-athletics); }
  .dot-fyi { background: var(--cat-fyi); }

  /* Badges */
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge-warning { background: var(--badge-warning-bg); color: var(--badge-warning-text); }
  .badge-critical { background: var(--badge-critical-bg); color: var(--badge-critical-text); }
  .badge-neutral { background: var(--badge-neutral-bg); color: var(--badge-neutral-text); }
  .badge-good { background: var(--badge-good-bg); color: var(--badge-good-text); }

  /* Action list */
  .action-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .action-item { display: flex; gap: 10px; align-items: flex-start; }
  .action-body { flex: 1; }
  .action-title { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .action-detail { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
  .action-contact { font-size: 12px; color: var(--muted); margin-top: 6px; font-style: italic; }

  /* Event list */
  .event-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .event-item { display: flex; align-items: baseline; gap: 8px; font-size: 13.5px; }
  .event-date { font-weight: 600; min-width: 66px; flex: none; }
  .event-desc { color: var(--text); }
  .event-desc em { color: var(--muted); font-style: italic; }

  /* Info / contact / icymi lists */
  .info-list, .contact-list, .icymi-list, .source-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .info-list li, .contact-list li { font-size: 13.5px; line-height: 1.5; }
  .icymi-list li { font-size: 13.5px; line-height: 1.5; }
  .icymi-date { font-weight: 600; color: var(--muted); margin-right: 6px; }

  .source-emails summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  .source-list { margin-top: 10px; }
  .source-list a { color: var(--accent); text-decoration: none; font-size: 13px; }
  .source-list a:hover { text-decoration: underline; }

  a { color: var(--accent); }
</style>
</head>

<div id="lock-screen">
  <div class="lock-icon">🍀</div>
  <h1>St. Anne Family Dashboard</h1>
  <p>Enter the family passphrase to view</p>
  <form id="lock-form">
    <input id="passphrase" type="password" autocomplete="current-password" placeholder="Passphrase" autofocus>
    <button id="unlock-btn" type="submit">Unlock</button>
    <div id="lock-error"></div>
  </form>
</div>

  var PBKDF2_ITERATIONS = 250000;

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function deriveKey(passphrase, saltBytes) {
    var enc = new TextEncoder();
    var baseKey = await crypto.subtle.importKey(
      "raw",
      enc.encode(passphrase),
      { name: "PBKDF2" },
      false,
      ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: saltBytes,
        iterations: PBKDF2_ITERATIONS,
        hash: "SHA-256"
      },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
  }

  async function unlock(passphrase) {
    var saltBytes = b64ToBytes(SALT_B64);
    var ivBytes = b64ToBytes(IV_B64);
    var ciphertextBytes = b64ToBytes(CIPHERTEXT_B64);
    var key = await deriveKey(passphrase, saltBytes);
    var plainBuf = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: ivBytes },
      key,
      ciphertextBytes
    );
    return new TextDecoder().decode(plainBuf);
  }

  function initTheme() {
    var toggle = document.getElementById("theme-toggle");
    if (!toggle) return;
    var stored = null;
    try { stored = window.__savedTheme || null; } catch (e) {}
    if (stored) document.documentElement.setAttribute("data-theme", stored);
    toggle.addEventListener("click", function () {
      var current = document.documentElement.getAttribute("data-theme");
      var next;
      if (current === "dark") next = "light";
      else if (current === "light") next = "dark";
      else {
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        next = prefersDark ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", next);
      window.__savedTheme = next;
    });
  }

  var form = document.getElementById("lock-form");
  var passInput = document.getElementById("passphrase");
  var errorEl = document.getElementById("lock-error");
  var lockScreen = document.getElementById("lock-screen");
  var app = document.getElementById("app");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    errorEl.textContent = "";
    var val = passInput.value;
    if (!val) return;
    unlock(val).then(function (html) {
      app.innerHTML = html;
      lockScreen.hidden = true;
      app.hidden = false;
      initTheme();
    }).catch(function (err) {
      errorEl.textContent = "Incorrect passphrase. Try again.";
      passInput.value = "";
      passInput.focus();
    });
  });

  // Service worker via blob, so this stays a single self-contained file.
  if ("serviceWorker" in navigator) {
    try {
      var swSource = [
        "self.addEventListener('install', function(e){ self.skipWaiting(); });",
        "self.addEventListener('activate', function(e){ e.waitUntil(self.clients.claim()); });",
        "self.addEventListener('fetch', function(e){ /* pass-through, no offline caching of encrypted content */ });"
      ].join("\n");
      var blob = new Blob([swSource], { type: "application/javascript" });
      var swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(function () {});
    } catch (e) {}
  }
})();
