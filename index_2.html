<style>

  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --card:           #ffffff;
    --series-1: #2a78d6; /* blue    - School-wide */
    --series-2: #eb6834; /* orange  - PTO / Family events */
    --series-3: #1baf7a; /* aqua    - Kindergarten */
    --series-7: #4a3aa7; /* violet  - Athletics */
    --status-good: #0ca30c;
    --status-warning: #fab219;
    --status-serious: #ec835a;
    --status-critical: #d03b3b;
    --status-good-bg: #e8f7e8;
    --status-warning-bg: #fef3de;
    --status-serious-bg: #fdeee7;
    --status-critical-bg: #fbe6e6;
    --status-neutral-bg: #eef0f3;
    --status-neutral-text: #52514e;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19; --page:#0d0d0d; --text-primary:#ffffff; --text-secondary:#c3c2b7;
      --text-muted:#898781; --gridline:#2c2c2a; --baseline:#383835; --border: rgba(255,255,255,0.10);
      --card:#232322;
      --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-7:#9085e9;
      --status-good:#0ca30c; --status-warning:#fab219; --status-serious:#ec835a; --status-critical:#e66767;
      --status-good-bg:#12351a; --status-warning-bg:#3a2f10; --status-serious-bg:#3a2418; --status-critical-bg:#3a1919;
      --status-neutral-bg:#2a2a29; --status-neutral-text:#c3c2b7;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19; --page:#0d0d0d; --text-primary:#ffffff; --text-secondary:#c3c2b7;
    --text-muted:#898781; --gridline:#2c2c2a; --baseline:#383835; --border: rgba(255,255,255,0.10);
    --card:#232322;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-7:#9085e9;
    --status-good:#0ca30c; --status-warning:#fab219; --status-serious:#ec835a; --status-critical:#e66767;
    --status-good-bg:#12351a; --status-warning-bg:#3a2f10; --status-serious-bg:#3a2418; --status-critical-bg:#3a1919;
    --status-neutral-bg:#2a2a29; --status-neutral-text:#c3c2b7;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }

  header.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .brand { display:flex; align-items:center; gap:14px; }
  .clover { font-size: 34px; line-height:1; }
  h1 { font-size: 22px; margin: 0 0 2px; font-weight: 700; }
  .subhead { color: var(--text-secondary); font-size: 14px; margin: 0; }
  .meta { text-align: right; font-size: 12px; color: var(--text-muted); }
  .theme-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text-secondary);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; margin-top: 6px;
  }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .stat .num { font-size: 26px; font-weight: 700; font-variant-numeric: proportional-nums; }
  .stat .label { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

  section { margin-bottom: 32px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-secondary); margin: 0 0 12px; font-weight: 700; }
  h2 .count { color: var(--text-muted); font-weight: 500; text-transform: none; letter-spacing: 0; }

  .cards { display: grid; gap: 10px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start;
  }
  .badge {
    flex: none; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    display:flex; align-items:center; gap:5px; white-space: nowrap; margin-top: 1px;
  }
  .badge.good { background: var(--status-good-bg); color: var(--status-good); }
  .badge.warning { background: var(--status-warning-bg); color: #8a5c00; }
  .badge.critical { background: var(--status-critical-bg); color: var(--status-critical); }
  .badge.neutral { background: var(--status-neutral-bg); color: var(--status-neutral-text); }
  :root[data-theme="dark"] .badge.warning, @media (prefers-color-scheme: dark) { }
  .card-body { flex: 1; min-width: 0; }
  .card-title { font-weight: 600; font-size: 14.5px; margin: 0 0 3px; }
  .card-detail { font-size: 13px; color: var(--text-secondary); margin: 0 0 4px; line-height: 1.45; }
  .card-foot { font-size: 12px; color: var(--text-muted); display:flex; gap: 12px; flex-wrap: wrap; }
  .card-foot a { color: var(--series-1); text-decoration: none; }
  .card-foot a:hover { text-decoration: underline; }

  .legend { display:flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; font-size: 12px; color: var(--text-secondary); }
  .legend span.dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }

  .timeline { border-left: 2px solid var(--gridline); margin-left: 6px; }
  .tl-item { position: relative; padding: 0 0 18px 22px; }
  .tl-item:last-child { padding-bottom: 0; }
  .tl-dot { position: absolute; left: -7px; top: 3px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--surface-1); }
  .tl-date { font-size: 12px; font-weight: 700; color: var(--text-primary); }
  .tl-title { font-size: 14.5px; font-weight: 600; margin: 2px 0 3px; }
  .tl-detail { font-size: 13px; color: var(--text-secondary); line-height: 1.45; }
  .tag { display:inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .box h3 { font-size: 14px; margin: 0 0 8px; }
  .box ul { margin: 0; padding-left: 18px; font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
  .box p { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin: 0 0 6px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--text-muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; padding: 8px 10px; border-bottom: 1px solid var(--gridline); }
  td { padding: 9px 10px; border-bottom: 1px solid var(--gridline); color: var(--text-secondary); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td.strong { color: var(--text-primary); font-weight: 600; }
  .contact-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .contact { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .contact .name { font-weight: 600; font-size: 13.5px; }
  .contact .role { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .contact .line { font-size: 12.5px; color: var(--text-secondary); }
  .contact a { color: var(--series-1); text-decoration: none; }

  .fyi { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; }
  .fyi .t { font-weight: 600; font-size: 13.5px; margin-bottom: 2px; }
  .fyi .d { font-size: 12.5px; color: var(--text-secondary); }

  .log-toggle { cursor: pointer; color: var(--series-1); font-size: 13px; font-weight: 600; }
  #log { display: none; margin-top: 10px; }
  #log.open { display: block; }

  footer { border-top: 1px solid var(--gridline); padding-top: 16px; margin-top: 12px; font-size: 12px; color: var(--text-muted); line-height: 1.6; }


  /* ---- lock screen ---- */
  .lock-wrap {
    min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .lock-card {
    max-width: 360px; width: 100%; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px 24px; text-align: center;
  }
  .lock-card .clover { font-size: 40px; margin-bottom: 6px; }
  .lock-card h1 { font-size: 17px; margin: 0 0 4px; }
  .lock-card p.hint { font-size: 13px; color: var(--text-secondary); margin: 0 0 18px; }
  .lock-card input[type=password] {
    width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--page); color: var(--text-primary); font-size: 15px; margin-bottom: 10px;
    box-sizing: border-box;
  }
  .lock-card button {
    width: 100%; padding: 11px 12px; border-radius: 8px; border: none;
    background: var(--series-1); color: white; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .lock-card button:active { opacity: 0.85; }
  .lock-error { color: var(--status-critical); font-size: 13px; margin-top: 10px; min-height: 16px; }
  #app { display: none; }
</style>
</head>
<body>

<div class="lock-wrap" id="lockScreen">
  <div class="lock-card">
    <div class="clover">☘️</div>
    <h1>St. Anne Family Dashboard</h1>
    <p class="hint">Enter the family passphrase to view</p>
    <input type="password" id="pw" placeholder="Passphrase" autocomplete="off" autofocus>
    <button onclick="unlock()">Unlock</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>

<div id="app" class="viz-root"></div>

  async function deriveKey(pass) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pass), {name: 'PBKDF2'}, false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64ToBytes(SALT_B64), iterations: ITERATIONS, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
  }

  async function unlock() {
    const pw = document.getElementById('pw').value;
    const errEl = document.getElementById('lockError');
    errEl.textContent = '';
    if (!pw) return;
    try {
      const key = await deriveKey(pw);
      const iv = b64ToBytes(IV_B64);
      const ct = b64ToBytes(CT_B64);
      const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
      const html = new TextDecoder().decode(plainBuf);
      document.getElementById('app').innerHTML = html;
      document.getElementById('app').style.display = 'block';
      document.getElementById('lockScreen').style.display = 'none';
    } catch (e) {
      errEl.textContent = 'Incorrect passphrase — try again.';
    }
  }

  document.getElementById('pw').addEventListener('keydown', function(e){
    if (e.key === 'Enter') unlock();
  });

  // best-effort installability (Android "Add to Home Screen" prompt) — safe to fail silently
  if ('serviceWorker' in navigator) {
    try {
      const swCode = "self.addEventListener('fetch', function(e){});";
      const blob = new Blob([swCode], { type: 'text/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(function(){});
    } catch (e) {}
  }
</script>
